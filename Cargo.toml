[package]
name = "provider"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
account = { path = "../account" }
# 宿主 IO：HTTP、下载、存储、定时（原生与 WASM 两种编译形态共用）。
hostio = { path = "../hostio" }
serde = "1.0.228"
serde_json = "1.0.145"
arc-swap = "1.7.1"
rand = "0.9.2"
tokio = { version = "1", default-features = false, features = ["sync"] }
futures = "0.3"
futures-util = "0.3.31"
csv = "1.4.0"
log = "0.4"
regex = "1"
base64 = "0.22"
urlencoding = "2"
ib-pinyin = "0.3"
memchr = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
